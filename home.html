</head>
<body>

            <div class="box-2"></div>

                <div class="box-01">
                    <div class="minibox-1"></div>

                    <div class="minibox-3"></div>
                </div>
                <div class="box-02">
                    <div class="minibox-01"></div>
                    <div class="minibox-02"></div>
                    <div class="minibox-03"></div>
                </div>
        </div>
        <div class="box-03"></div>
       </div>
    </div>
